services:
  # VoiceBack Backend Node.js Express + Socket.io Web Service
  - type: web
    name: voiceback-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: CARTESIA_API_KEY
        sync: false
      - key: CARTESIA_TTS_MODEL
        value: sonic-3
      - key: CARTESIA_VERSION
        value: "2026-08-14"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_TTS_MODEL
        value: eleven_multilingual_v2

  # VoiceBack Progressive Web App (React 19 / Vite Static Site)
  - type: web
    name: voiceback-pwa
    runtime: static
    rootDir: pwa
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

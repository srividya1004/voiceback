<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VoiceBack WebAudio 16kHz 16-bit Mono PCM Conversion Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #111; color: #eee; }
    .pass { color: #4ade80; font-weight: bold; }
    .fail { color: #f87171; font-weight: bold; }
    .box { border: 1px solid #333; padding: 15px; margin-top: 15px; border-radius: 8px; background: #1a1a1a; }
  </style>
</head>
<body>
  <h1>VoiceBack WebAudio BLE Pipeline Conversion Test</h1>
  <p>Tests browser-native AudioContext.decodeAudioData(), OfflineAudioContext resampling to 16 kHz mono, and Float32 -> signed 16-bit PCM Int16Array conversion.</p>

  <div id="test-status" class="box">Running conversion test...</div>
  <pre id="test-details" class="box"></pre>

  <script>
    // Create a 1-second 44.1kHz test audio buffer with audio data to test decoding and resampling
    function createTestAudioWavBuffer() {
      const sampleRate = 44100;
      const duration = 1.0;
      const numSamples = Math.floor(sampleRate * duration);
      const buffer = new ArrayBuffer(44 + numSamples * 2);
      const view = new DataView(buffer);

      // Write WAV header
      const writeString = (offset, string) => {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      };

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + numSamples * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, numSamples * 2, true);

      // Generate 440 Hz sine wave tone
      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        const sample = Math.sin(2 * Math.PI * 440 * t) * 0.75;
        view.setInt16(44 + i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
      }

      return buffer;
    }

    async function runWebAudioConversionTest() {
      const statusEl = document.getElementById('test-status');
      const detailsEl = document.getElementById('test-details');

      try {
        const testWavBuffer = createTestAudioWavBuffer();

        // 1. Browser WebAudio AudioContext decoding
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioContext;
        try {
          audioContext = new AudioCtx();
          if (audioContext.state === 'suspended') {
            await audioContext.resume().catch(() => {});
          }
        } catch (ctxErr) {
          audioContext = new OfflineAudioContext(1, 1, 44100);
        }

        let decodedAudio;
        try {
          decodedAudio = await audioContext.decodeAudioData(testWavBuffer.slice(0));
        } catch (decodeErr) {
          const offlineDecoder = new OfflineAudioContext(1, 1, 44100);
          decodedAudio = await offlineDecoder.decodeAudioData(testWavBuffer.slice(0));
        }

        const originalSampleRate = decodedAudio.sampleRate;
        const originalChannels = decodedAudio.numberOfChannels;
        const originalDuration = decodedAudio.duration;

        console.log('[WebAudio Test] 1. AudioContext.decodeAudioData() success:', {
          sampleRate: originalSampleRate,
          channels: originalChannels,
          duration: originalDuration
        });

        // 2. OfflineAudioContext resampling to 16,000 Hz Mono (VoiceBack ESP32/BLE contract)
        const targetSampleRate = 16000;
        const sourceData = decodedAudio.getChannelData(0);
        const targetLength = Math.floor(sourceData.length * targetSampleRate / decodedAudio.sampleRate);

        const offlineContext = new OfflineAudioContext(1, targetLength, targetSampleRate);
        const audioBuffer = offlineContext.createBuffer(1, sourceData.length, decodedAudio.sampleRate);
        audioBuffer.copyToChannel(sourceData, 0);

        const source = offlineContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(offlineContext.destination);
        source.start(0);

        const renderedAudio = await offlineContext.startRendering();
        const resampledSamples = renderedAudio.getChannelData(0);

        // 3. Float32 -> Signed 16-bit PCM Int16Array
        const pcm = new Int16Array(resampledSamples.length);
        for (let i = 0; i < resampledSamples.length; i++) {
          const sample = Math.max(-1, Math.min(1, resampledSamples[i]));
          pcm[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
        }

        const pcmBytes = new Uint8Array(pcm.buffer);

        // Verification assertions
        const isMono = renderedAudio.numberOfChannels === 1;
        const is16kHz = renderedAudio.sampleRate === 16000;
        const isInt16 = pcm instanceof Int16Array;
        const hasData = pcmBytes.length === targetLength * 2;
        const hasValidNonZero = pcm.some(val => val !== 0);

        if (isMono && is16kHz && isInt16 && hasData && hasValidNonZero) {
          statusEl.className = 'box pass';
          statusEl.innerHTML = '✅ TEST PASS: WebAudio 16kHz 16-bit Mono PCM Pipeline Verified';

          detailsEl.textContent = JSON.stringify({
            status: 'PASS',
            original: {
              sampleRate: originalSampleRate,
              channels: originalChannels,
              durationSeconds: originalDuration.toFixed(2)
            },
            rendered: {
              sampleRate: renderedAudio.sampleRate,
              channels: renderedAudio.numberOfChannels,
              targetLengthSamples: targetLength,
              durationSeconds: renderedAudio.duration.toFixed(2)
            },
            pcmPayload: {
              type: 'Int16Array (signed 16-bit PCM)',
              totalBytes: pcmBytes.length,
              sampleCount: pcm.length,
              verifiedNonZero: true
            },
            bleContractSatisfied: {
              sampleRate: '16,000 Hz',
              bitDepth: '16-bit signed integer',
              channels: 'mono (1)',
              status: 'COMPLIANT'
            }
          }, null, 2);
        } else {
          throw new Error('WebAudio conversion metrics did not meet 16kHz 16-bit mono contract');
        }
      } catch (err) {
        statusEl.className = 'box fail';
        statusEl.innerHTML = '❌ TEST FAIL: ' + err.message;
        detailsEl.textContent = err.stack || err.message;
      }
    }

    window.addEventListener('DOMContentLoaded', runWebAudioConversionTest);
  </script>
</body>
</html>
